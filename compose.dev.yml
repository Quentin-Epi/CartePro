services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tickettout-backend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: postgres://tickettout:tickettout@postgres:5432/tickettout
      RUST_LOG: debug
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: tickettout-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - node_modules:/app/node_modules
    command: sh -c "npm i && npm run dev -- --host 0.0.0.0"
    environment:
      NODE_ENV: development
    depends_on:
      - backend

  postgres:
    image: postgres:18
    container_name: tickettout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tickettout
      POSTGRES_PASSWORD: tickettout
      POSTGRES_DB: tickettout
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickettout -d tickettout"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
  cargo_cache:
  target_cache:
  node_modules:
